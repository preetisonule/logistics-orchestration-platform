services:
  postgres:
    network_mode: host
    ports: !reset []

  kafka:
    network_mode: host
    ports: !reset []
    environment:
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093

  inventory-service:
    network_mode: host
    ports: !reset []
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@127.0.0.1:5432/inventory_db
      KAFKA_BROKER: 127.0.0.1:9092

  warehouse-service:
    network_mode: host
    ports: !reset []
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@127.0.0.1:5432/warehouse_db
      KAFKA_BROKER: 127.0.0.1:9092

  carrier-selection-service:
    network_mode: host
    ports: !reset []
    environment:
      KAFKA_BROKER: 127.0.0.1:9092

  shipment-service:
    network_mode: host
    ports: !reset []
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@127.0.0.1:5432/shipment_db
      KAFKA_BROKER: 127.0.0.1:9092

  event-service:
    network_mode: host
    ports: !reset []
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@127.0.0.1:5432/event_db
      KAFKA_BROKER: 127.0.0.1:9092

  dashboard:
    network_mode: host
    ports: !reset []
    volumes:
      - ./dashboard/nginx.codespaces.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      inventory-service:
        condition: service_healthy
      warehouse-service:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
